name: Construire installateur Windows (test)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q race_control_live_V4_INTERFACE.py racecontrol
      - name: Construire l'application
        shell: pwsh
        run: ./build_windows.ps1
      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Créer l'installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup introuvable: $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GT7-Race-Control-Ecurie-Windows-Setup-test
          path: Output/*.exe
          if-no-files-found: error
          retention-days: 14
